name: Build Homelab Image

on:
  push:
    branches: [main, codex/brabus-store-homelab-migration]
  workflow_dispatch:

concurrency:
  group: build-homelab-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DATABASE_URL: postgresql://brabustore:brabustore@127.0.0.1:5432/brabustore_ci?schema=public

jobs:
  image:
    name: Validate and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brabustore
          POSTGRES_PASSWORD: brabustore
          POSTGRES_DB: brabustore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brabustore -d brabustore_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply test database migrations
        run: npx prisma migrate deploy

      - name: Seed test database
        run: npx prisma db seed

      - name: Lint
        run: npm run lint -- .

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/melojrx/brabus_store:${{ github.sha }}

      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/melojrx/brabus_store@${IMAGE_DIGEST}"
          {
            echo "### Homelab image"
            echo
            echo "- Image: `${image}`"
            echo "- Commit: `${GITHUB_SHA}`"
            echo "- Platform: `linux/amd64`"
          } >> "$GITHUB_STEP_SUMMARY"
