name: Build Homelab Image

on:
  push:
    branches: [main, codex/brabus-store-homelab-migration]
  workflow_dispatch:

concurrency:
  group: build-homelab-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Validate and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- .

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/melojrx/brabus_store:${{ github.sha }}

      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/melojrx/brabus_store@${IMAGE_DIGEST}"
          {
            echo "### Homelab image"
            echo
            echo "- Image: `${image}`"
            echo "- Commit: `${GITHUB_SHA}`"
            echo "- Platform: `linux/amd64`"
          } >> "$GITHUB_STEP_SUMMARY"
